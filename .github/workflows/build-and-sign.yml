name: Build and Sign SDR-Hub Images

"on":
  push:
    branches:
      - master
      - devel
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

  pull_request:
    branches:
      - master
      - devel

  workflow_dispatch:

run-name: >-
  SDR-Hub · ${{ github.event_name }} ·
  ${{ github.ref_name }}

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/sdr-hub
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-sign:
    name: Build, Publish, Verify, and Sign SDR-Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"

            {
              echo "version=${VERSION}"
              echo "is_release=true"
              echo "primary_tag=${IMAGE_GHCR}:${VERSION}"
              echo "tags<<EOF"
              echo "${IMAGE_GHCR}:${VERSION}"
              echo "${IMAGE_GHCR}:v${VERSION}"
              echo "${IMAGE_GHCR}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"

          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            {
              echo "version=master"
              echo "is_release=false"
              echo "primary_tag=${IMAGE_GHCR}:master"
              echo "tags<<EOF"
              echo "${IMAGE_GHCR}:master"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"

          else
            {
              echo "version=devel"
              echo "is_release=false"
              echo "primary_tag=${IMAGE_GHCR}:devel"
              echo "tags<<EOF"
              echo "${IMAGE_GHCR}:devel"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Load SDR component versions
        uses: aarcangeli/load-dotenv@v1
        with:
          filenames: .sdr_versions

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull-request test image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sdr-hub:pr-test
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE=${{ env.SDR_MONITOR_IMAGE }}
            SDR_SCANNER_IMAGE=${{ env.SDR_SCANNER_IMAGE }}
          cache-from: type=gha

      - name: Build and publish multi-architecture image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE=${{ env.SDR_MONITOR_IMAGE }}
            SDR_SCANNER_IMAGE=${{ env.SDR_SCANNER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm Buildx returned image index digest
        id: digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "::error::Buildx did not return a published image digest."
            exit 1
          fi

          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Unexpected Buildx digest: ${IMAGE_DIGEST}"
            exit 1
          fi

          echo "image=${IMAGE_GHCR}@${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Verify published multi-architecture manifest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Inspecting ${IMAGE_REF}"
          MANIFEST="$(docker buildx imagetools inspect "${IMAGE_REF}")"

          echo "${MANIFEST}"
          grep -q "linux/amd64" <<< "${MANIFEST}"
          grep -q "linux/arm64" <<< "${MANIFEST}"

      - name: Verify primary tag resolves to built image index
        if: github.event_name != 'pull_request'
        env:
          PRIMARY_TAG: ${{ steps.tags.outputs.primary_tag }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_DIGEST="$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${PRIMARY_TAG}"
          )"

          echo "Primary tag: ${PRIMARY_TAG}"
          echo "Tag digest: ${TAG_DIGEST}"
          echo "Built digest: ${EXPECTED_DIGEST}"

          if [[ "${TAG_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
            echo "::error::The primary tag does not resolve to the image index built in this run."
            exit 1
          fi

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign immutable GHCR image index
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Signing ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

      - name: Verify Cosign signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/build-and-sign.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"