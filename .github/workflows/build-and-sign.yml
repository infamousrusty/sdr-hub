name: Build and Sign SDR-Hub Images

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]
  release:
    types: [published]

env:
  IMAGE_DOCKER: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}
  IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  PLATFORMS: linux/arm/v7,linux/arm64/v8,linux/amd64
  CACHE_FROM_DOCKER: type=registry,ref=${{ env.IMAGE_DOCKER }}:cache
  CACHE_TO_DOCKER: type=registry,ref=${{ env.IMAGE_DOCKER }}:cache,mode=max

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        id: login_docker
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Warn if Docker Hub login failed
        if: steps.login_docker.outcome == 'failure'
        run: |
          echo "::warning::Docker Hub login failed; Docker Hub pushes will be skipped in this run."

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update .sdr_versions
        if: ${{ github.ref_type == 'branch' && contains(vars.CI_BRANCH, github.ref_name) }}
        run: |
          sed -i .sdr_versions -e "s/sdr-monitor:.*/sdr-monitor:${{ github.ref_name }}/g"
          sed -i .sdr_versions -e "s/sdr-scanner:.*/sdr-scanner:${{ github.ref_name }}/g"

      - name: Load .sdr_versions file
        uses: aarcangeli/load-dotenv@v1
        with:
          filenames: .sdr_versions

      - name: Build multi-arch image (test)
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE
            SDR_SCANNER_IMAGE
          context: .
          load: true
          tags: ${{ env.IMAGE_DOCKER }}:test
          cache-from: ${{ env.CACHE_FROM_DOCKER }}

      - name: Push development image to Docker Hub
        if: ${{ github.ref_type == 'branch' && contains(vars.CI_BRANCH, github.ref_name) && steps.login_docker.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE
            SDR_SCANNER_IMAGE
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_DOCKER }}:${{ github.ref_name }}
          cache-from: ${{ env.CACHE_FROM_DOCKER }}
          cache-to: ${{ env.CACHE_TO_DOCKER }}

      - name: Push development image to GHCR
        if: ${{ github.ref_type == 'branch' && contains(vars.CI_BRANCH, github.ref_name) }}
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE
            SDR_SCANNER_IMAGE
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_GHCR }}:${{ github.ref_name }}

      - name: Push release image to Docker Hub
        if: ${{ github.ref_type == 'tag' && steps.login_docker.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE
            SDR_SCANNER_IMAGE
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.IMAGE_DOCKER }}:latest
            ${{ env.IMAGE_DOCKER }}:${{ github.ref_name }}
          cache-from: ${{ env.CACHE_FROM_DOCKER }}
          cache-to: ${{ env.CACHE_TO_DOCKER }}

      - name: Push release image to GHCR
        if: ${{ github.ref_type == 'tag' }}
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE
            SDR_SCANNER_IMAGE
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.IMAGE_GHCR }}:latest
            ${{ env.IMAGE_GHCR }}:${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign release images with Cosign
        if: ${{ github.ref_type == 'tag' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE_GHCR }}:${{ github.ref_name }}
          if [ "${{ steps.login_docker.outcome }}" = "success" ]; then
            cosign sign --yes ${{ env.IMAGE_DOCKER }}:${{ github.ref_name }}
          else
            echo "::warning::Docker Hub login failed earlier; Docker Hub image will not be signed in this run."
