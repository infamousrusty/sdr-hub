name: Build and Sign SDR-Hub Images

"on":
  push:
    branches:
      - master
      - devel
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

  pull_request:
    branches:
      - master
      - devel

  release:
    types:
      - published

  workflow_dispatch:

run-name: >-
  SDR-Hub · ${{ github.event_name }} ·
  ${{ github.ref_name }}

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/sdr-hub
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-sign:
    name: Build, Publish, and Sign SDR-Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"

            {
              echo "version=${VERSION}"
              echo "is_release=true"
              echo "tags<<EOF"
              echo "${IMAGE_GHCR}:${VERSION}"
              echo "${IMAGE_GHCR}:v${VERSION}"
              echo "${IMAGE_GHCR}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"

          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            {
              echo "version=master"
              echo "is_release=false"
              echo "tags<<EOF"
              echo "${IMAGE_GHCR}:master"
              echo "${IMAGE_GHCR}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"

          else
            {
              echo "version=${GITHUB_REF_NAME}"
              echo "is_release=false"
              echo "tags<<EOF"
              echo "${IMAGE_GHCR}:${GITHUB_REF_NAME}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Load SDR component versions
        uses: aarcangeli/load-dotenv@v1
        with:
          filenames: .sdr_versions

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull-request test image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sdr-hub:pr-test
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE=${{ env.SDR_MONITOR_IMAGE }}
            SDR_SCANNER_IMAGE=${{ env.SDR_SCANNER_IMAGE }}
          cache-from: type=gha

      - name: Build and publish multi-architecture image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            SDR_MONITOR_IMAGE=${{ env.SDR_MONITOR_IMAGE }}
            SDR_SCANNER_IMAGE=${{ env.SDR_SCANNER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="${IMAGE_GHCR}:${{ steps.tags.outputs.version }}"

          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            IMAGE_REF="${IMAGE_GHCR}:latest"
          fi

          docker buildx imagetools inspect "${IMAGE_REF}"

          MANIFEST="$(docker buildx imagetools inspect "${IMAGE_REF}")"
          grep -q "linux/amd64" <<< "${MANIFEST}"
          grep -q "linux/arm64" <<< "${MANIFEST}"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign published GHCR image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "::error::Buildx did not return a published image digest."
            exit 1
          fi

          cosign sign --yes "${IMAGE_GHCR}@${IMAGE_DIGEST}"