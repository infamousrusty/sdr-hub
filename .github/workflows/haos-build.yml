name: Build and Publish HAOS Add-on

on:
  push:
    branches: [haos-addon]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on (${{ matrix.arch }})
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target sdr-hub \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --image sdr-hub

      - name: Login to Docker Hub (optional mirror)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Mirror to Docker Hub
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-sdr-hub"
          TAG="latest"
          docker pull "$IMAGE:$TAG" || true
          docker tag "$IMAGE:$TAG" "${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.arch }}-sdr-hub:$TAG" || true
          docker push "${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.arch }}-sdr-hub:$TAG" || echo "::warning::Docker Hub mirror failed"
        continue-on-error: true
