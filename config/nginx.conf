worker_processes auto;

pid /var/run/sdr/nginx.pid;
error_log /var/log/sdr/nginx_error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format sdr_hub
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr upstream_status=$upstream_status '
        'request_time=$request_time upstream_response_time=$upstream_response_time';

    access_log /var/log/sdr/access.log sdr_hub;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream sdr_monitor_backend {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    upstream sdr_control_backend {
        server 127.0.0.1:9001;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        client_max_body_size 32m;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        # Home Assistant Ingress supplies this header. Passing it on lets an
        # application construct links/assets correctly behind its ingress path.
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header X-External-Path $http_x_ingress_path;

        # Standard reverse-proxy headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep the original HTTP version and support ordinary HTTP plus
        # WebSocket requests through the same reverse proxy.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok
";
        }

        location /static/ {
            alias /app/data/public/static/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        location /media/ {
            alias /app/data/public/media/;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location = /favicon.ico {
            alias /app/data/public/static/img/favicon.ico;
            access_log off;
            log_not_found off;
        }

        # Control/MQTT service. The trailing slash intentionally strips
        # /mqtt/ before forwarding to the upstream.
        location /mqtt/ {
            proxy_pass http://sdr_control_backend/;
            proxy_buffering off;
        }

        # SDR Monitor UI and API. The trailing slash deliberately forwards
        # ingress-stripped request paths to the service on port 8000.
        location / {
            proxy_pass http://sdr_monitor_backend/;
            proxy_buffering off;
        }
    }
}