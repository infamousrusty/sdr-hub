name: SDR Hub
version: "1.0.2"
slug: sdr_hub
description: Software Defined Radio hub for Home Assistant
url: https://github.com/infamousrusty/sdr-hub

arch:
  - amd64
  - aarch64

init: false
startup: services

hassio_api: true
homeassistant_api: true

ingress: true
ingress_port: 80
panel_icon: mdi:radio

usb: true
uart: true

options:
  log_level: info
  mqtt:
    enabled: true
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
    base_topic: sdr_hub
  radios: []

schema:
  log_level: list(debug|info|warning|error)

  mqtt:
    enabled: bool
    host: str
    port: port
    username: str?
    password: password?
    base_topic: str

  radios:
    - id: str
      enabled: bool
      backend: list(rtl_sdr|hackrf|airspy|sdrplay|serial|other)
      selector: str?
      device: str?
      baud_rate: int?
      protocol: str?
      frequency_hz: int?
      sample_rate_hz: int?
      gain: str?
      ppm: int?
      extra_args: str?

image: ghcr.io/infamousrusty/sdr-hub